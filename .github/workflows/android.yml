name: Android

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  KS_PATH: ${{ github.workspace }}/keystore/release.jks
  KS_PASSWORD: '123qweQWE@#$_&-'
  KEY_PASSWORD: '123qweQWE@#$_&-'
  KEY_ALIAS: mykey

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply app icon
        run: cp -r resources/android/res/. android/app/src/main/res/

      - name: Create keystore if missing
        run: |
          if [ ! -f keystore/release.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v -keystore keystore/release.jks \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Waleed Play, O=Waleed, C=EG"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -f keystore/release.jks
            git commit -m "Add release keystore"
            git push
          fi

      - name: Patch gradle (version code + signing)
        run: python3 scripts/patch-gradle.py

      - name: Build APK + AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: waleed-play
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
