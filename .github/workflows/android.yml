name: Extract ZIP and Build Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          
          # البحث عن أي ملف zip موجود في الـ repository
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" ! -path "./.git/*" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository!"
            exit 1
          fi
          
          echo "Found ZIP: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          # البحث عن ملف package.json وتحديد مجلد المشروع
          PACKAGE_JSON=$(find extracted -type f -name "package.json" ! -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found inside ZIP!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PACKAGE_JSON")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project directory identified as: $PROJECT_DIR"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install
