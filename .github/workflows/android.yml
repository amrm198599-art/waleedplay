name: Extract ZIP and Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" ! -path "./.git/*" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository!"
            exit 1
          fi
          
          echo "Found ZIP: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          PACKAGE_JSON=$(find extracted -type f -name "package.json" ! -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found inside ZIP!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PACKAGE_JSON")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project directory identified as: $PROJECT_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web Assets & Setup Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if npm run | grep -q "build"; then
            npm run build
          fi

          npx @capacitor/cli add android || true
          npx @capacitor/cli sync android

      - name: Build Android APK via Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
            echo "Android APK built successfully!"
          else
            echo "ERROR: Android platform directory was not generated."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
