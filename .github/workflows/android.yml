name: Extract ZIP and Build Android

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Extract project ZIP
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install -y unzip

      ZIP_FILE=$(find . -type f -iname "*.zip" -not -path "./.git/*" -print -quit)

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No ZIP file found"
        exit 1
      fi

      echo "Found ZIP: $ZIP_FILE"
      mkdir -p extracted
      unzip -o "$ZIP_FILE" -d extracted
      find extracted -maxdepth 3 -type f | head -100

  - name: Find package.json
    shell: bash
    run: |
      PACKAGE_FILE=$(find extracted -type f -name package.json -not -path "*/node_modules/*" -print -quit)

      if [ -z "$PACKAGE_FILE" ]; then
        echo "ERROR: package.json not found"
        exit 1
      fi

      PROJECT_DIR=$(dirname "$PACKAGE_FILE")
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Project directory: $PROJECT_DIR"

  - name: Install Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install dependencies
    run: npm install
    working-directory: ${{ env.PROJECT_DIR }}
