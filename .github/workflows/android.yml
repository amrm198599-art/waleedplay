      - name: Extract project ZIP
        run: |
          sudo apt-get install -y unzip

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          ls -la extracted
